{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">
            Miss France 2026
        </h1>
        <p class="auth-subtitle">Créez votre compte</p>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus minlength="3">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-input" required minlength="4">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password_confirm">Confirmer le mot de passe</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-input" required minlength="4">
            </div>
            
            <button type="submit" class="btn btn-primary">Créer mon compte</button>
        </form>
        
        <div class="auth-link">
            <p>Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
        </div>
    </div>
</div>
{% endblock %}
